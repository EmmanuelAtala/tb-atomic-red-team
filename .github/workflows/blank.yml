name: Atomic Red Team

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target OS for the new instance'
        required: true
        type: choice
        options:
          - linux
          - windows
      instance_type:
        description: 'EC2 instance type'
        required: true
        type: string
        default: 't3.micro'
      subnet_id:
        description: 'Optional: specific subnet ID. Leave blank to auto-detect a default subnet.'
        required: false
        type: string
        default: ''
      terminate_after:
        description: 'Terminate the instance after the run completes'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'yes'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::560120514170:role/stratus-red-team-lab
  INSTANCE_PROFILE_NAME: atomic-lab-profile
  INSTANCE_ROLE_NAME: atomic-lab-ec2-role

jobs:
  atomic-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for techniques file)
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure instance profile exists
        run: |
          set -euo pipefail
          if ! aws iam get-instance-profile --instance-profile-name "$INSTANCE_PROFILE_NAME" >/dev/null 2>&1; then
            echo "Creating IAM role and instance profile for lab instances..."
            aws iam create-role \
              --role-name "$INSTANCE_ROLE_NAME" \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
            aws iam attach-role-policy \
              --role-name "$INSTANCE_ROLE_NAME" \
              --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            aws iam create-instance-profile --instance-profile-name "$INSTANCE_PROFILE_NAME"
            aws iam add-role-to-instance-profile \
              --instance-profile-name "$INSTANCE_PROFILE_NAME" \
              --role-name "$INSTANCE_ROLE_NAME"
            echo "Waiting for IAM propagation..."
            sleep 20
          else
            echo "Instance profile already exists."
          fi

      - name: Launch EC2 instance
        id: launch
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.subnet_id }}" ]; then
            SUBNET_ID="${{ inputs.subnet_id }}"
          else
            SUBNET_ID=$(aws ec2 describe-subnets \
              --filters "Name=default-for-az,Values=true" \
              --query 'Subnets[0].SubnetId' --output text)
          fi

          if [ "$SUBNET_ID" = "None" ] || [ -z "$SUBNET_ID" ]; then
            echo "No default subnet found and none provided via subnet_id input." >&2
            exit 1
          fi

          VPC_ID=$(aws ec2 describe-subnets --subnet-ids "$SUBNET_ID" --query 'Subnets[0].VpcId' --output text)
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=default" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text)

          if [ "${{ inputs.os }}" = "windows" ]; then
            AMI_ID=$(aws ssm get-parameters \
              --names /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base \
              --query 'Parameters[0].Value' --output text)
          else
            AMI_ID=$(aws ssm get-parameters \
              --names /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
              --query 'Parameters[0].Value' --output text)
          fi

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type "${{ inputs.instance_type }}" \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids "$SG_ID" \
            --iam-instance-profile "Name=$INSTANCE_PROFILE_NAME" \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=atomic-red-team-lab}]' \
            --query 'Instances[0].InstanceId' --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Launched instance $INSTANCE_ID ($AMI_ID)"

      - name: Wait for instance to be running
        run: aws ec2 wait instance-running --instance-ids "${{ steps.launch.outputs.instance_id }}"

      - name: Wait for SSM registration
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "None")
            echo "Attempt $i: SSM status=$STATUS"
            if [ "$STATUS" = "Online" ]; then
              break
            fi
            sleep 10
          done
          if [ "$STATUS" != "Online" ]; then
            echo "Instance never registered with SSM (last status: $STATUS)." >&2
            exit 1
          fi
          echo "SSM reports Online; waiting 30s extra for the agent to be ready to execute commands..."
          sleep 30

      - name: Bootstrap execution framework
        id: bootstrap
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"

          if [ "${{ inputs.os }}" = "windows" ]; then
            DOCUMENT="AWS-RunPowerShellScript"
            LINES=(
              'if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force }'
              'if (-not (Get-Module -ListAvailable -Name powershell-yaml)) { Install-Module -Name powershell-yaml -Force -Scope AllUsers -Repository PSGallery }'
              'if (-not (Test-Path "C:\AtomicRedTeam\invoke-atomicredteam\Invoke-AtomicRedTeam.psd1")) { IEX (IWR "https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/install-atomicredteam.ps1" -UseBasicParsing); Install-AtomicRedTeam -getAtomics -Force -noPayloads }'
              'Import-Module "C:\AtomicRedTeam\invoke-atomicredteam\Invoke-AtomicRedTeam.psd1" -Force'
            )
          else
            DOCUMENT="AWS-RunShellScript"

            # Build the PowerShell script as an array of plain single-quoted lines
            # (no heredoc - heredoc terminators are indentation-strict in a way
            # that conflicts with YAML's own indentation stripping), then
            # base64-encode it to avoid nested-quoting issues downstream.
            PS_LINES=(
              'if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force }'
              'if (-not (Get-Module -ListAvailable -Name powershell-yaml)) { Install-Module -Name powershell-yaml -Force -Scope AllUsers -Repository PSGallery }'
              'if (-not ((Test-Path "/opt/AtomicRedTeam/invoke-atomicredteam/Invoke-AtomicRedTeam.psd1") -and (Test-Path "/opt/AtomicRedTeam/atomics"))) {'
              '  IEX (IWR "https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/install-atomicredteam.ps1" -UseBasicParsing)'
              '  Install-AtomicRedTeam -InstallPath "/opt/AtomicRedTeam" -getAtomics -Force -noPayloads -Verbose -ErrorAction Continue'
              '}'
              'Write-Host "atomics folder exists: $(Test-Path '"'"'/opt/AtomicRedTeam/atomics'"'"')"'
              'if (Test-Path "/opt/AtomicRedTeam/atomics") {'
              '  Write-Host "atomics item count: $((Get-ChildItem '"'"'/opt/AtomicRedTeam/atomics'"'"').Count)"'
              '}'
            )
            PS_SCRIPT=$(printf '%s\n' "${PS_LINES[@]}")
            PS_SCRIPT_B64=$(printf '%s' "$PS_SCRIPT" | base64 -w0)

            LINES=(
              'if ! command -v pwsh &> /dev/null; then PS_RPM_URL=$(curl -s --max-time 15 https://api.github.com/repos/PowerShell/PowerShell/releases/latest | grep -o "https://[^\"]*rh.x86_64.rpm" | head -n1); echo "Resolved PowerShell RPM URL: $PS_RPM_URL"; curl -sSL --max-time 60 "$PS_RPM_URL" -o /tmp/powershell.rpm; ls -la /tmp/powershell.rpm; dnf install -y --nogpgcheck /tmp/powershell.rpm < /dev/null; fi'
              "echo $PS_SCRIPT_B64 | base64 -d > /tmp/bootstrap.ps1"
              'pwsh -File /tmp/bootstrap.ps1 < /dev/null'
            )
          fi

          PARAMS_JSON=$(printf '%s\n' "${LINES[@]}" | jq -R . | jq -s '{commands: .}')

          send_and_wait() {
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "$DOCUMENT" \
              --parameters "$PARAMS_JSON" \
              --query "Command.CommandId" --output text)

            for i in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              echo "Bootstrap attempt $i: status=$STATUS"
              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut) break ;;
              esac
              sleep 10
            done
          }

          send_and_wait

          if [ "$STATUS" = "TimedOut" ]; then
            echo "First attempt timed out (likely SSM agent not fully ready yet). Retrying once..."
            sleep 15
            send_and_wait
          fi

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Bootstrap failed (final status: $STATUS)." >&2
            exit 1
          fi

      - name: Run techniques from file
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"

          if [ ! -f atomic-techniques.txt ]; then
            echo "atomic-techniques.txt not found in repo root" >&2
            exit 1
          fi

          TECHNIQUES=$(grep -v '^\s*#' atomic-techniques.txt | grep -v '^\s*$')

          for TECH in $TECHNIQUES; do
            echo "=== Running $TECH ==="

            if [ "${{ inputs.os }}" = "windows" ]; then
              DOCUMENT="AWS-RunPowerShellScript"
              LINES=(
                'Import-Module "C:\AtomicRedTeam\invoke-atomicredteam\Invoke-AtomicRedTeam.psd1" -Force'
                "Invoke-AtomicTest $TECH -PathToAtomicsFolder 'C:\AtomicRedTeam\atomics'"
              )
            else
              DOCUMENT="AWS-RunShellScript"
              LINES=(
                "pwsh -Command \"Import-Module '/opt/AtomicRedTeam/invoke-atomicredteam/Invoke-AtomicRedTeam.psd1' -Force; Invoke-AtomicTest $TECH -PathToAtomicsFolder '/opt/AtomicRedTeam/atomics'\""
              )
            fi

            PARAMS_JSON=$(printf '%s\n' "${LINES[@]}" | jq -R . | jq -s '{commands: .}')

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "$DOCUMENT" \
              --parameters "$PARAMS_JSON" \
              --query "Command.CommandId" --output text)

            for i in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut) break ;;
              esac
              sleep 10
            done

            echo "--- $TECH stdout ---"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" --output text
            echo "--- $TECH stderr ---"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            echo "--- $TECH status: $STATUS ---"
          done

      - name: Terminate instance
        if: always() && inputs.terminate_after == 'yes'
        run: |
          aws ec2 terminate-instances --instance-ids "${{ steps.launch.outputs.instance_id }}" || true
